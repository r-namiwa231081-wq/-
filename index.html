<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>3D Learning World - リアル化＆バグ修正版</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; display: block; }
        
        /* UI Layer */
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; /* 普段はクリックを貫通させる */
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        
        /* クロスヘア（照準） */
        #crosshair {
            width: 10px; height: 10px; background-color: white; border: 2px solid black;
            border-radius: 50%; position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        /* スタート画面 */
        #start-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7); color: white;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            pointer-events: auto; /* ここはクリック可能 */
            z-index: 200;
        }
        #start-screen h1 { font-size: 3rem; margin-bottom: 10px; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
        #start-screen p { margin-bottom: 30px; font-size: 1.2rem; }
        #start-btn {
            padding: 15px 40px; font-size: 1.5rem; cursor: pointer;
            background: #ff7e5f; color: white; border: none; border-radius: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s;
        }
        #start-btn:hover { transform: scale(1.05); }

        /* クイズ画面 */
        #quiz-modal {
            display: none; background: white; padding: 30px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center;
            pointer-events: auto; /* ★修正：確実にクリックできるようにする */
            z-index: 100; max-width: 500px; width: 90%;
        }
        #quiz-title { color: #333; margin-top: 0; font-size: 1.5rem; }
        #quiz-question { font-size: 1.2rem; margin-bottom: 20px; color: #555; }
        .answer-btn {
            display: block; width: 100%; padding: 15px; margin: 10px 0;
            font-size: 1.1rem; cursor: pointer; background: #4CAF50; color: white;
            border: none; border-radius: 8px; transition: background 0.2s;
        }
        .answer-btn:hover { background: #45a049; }

        /* ステータスバー */
        #status-bar {
            position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.6);
            color: white; padding: 15px; border-radius: 10px; pointer-events: none;
        }
        #status-bar h2 { margin: 0 0 10px 0; font-size: 1.2rem; }
    </style>
</head>
<body>

<div id="start-screen">
    <h1>3D Edu-World</h1>
    <p>クリックしてスタート<br>【WASD】移動 / 【マウス】視点 / 【左クリック】魔法(クイズ開始)</p>
    <button id="start-btn">世界に入る</button>
</div>

<div id="ui-layer">
    <div id="crosshair"></div>
    
    <div id="quiz-modal">
        <h2 id="quiz-title">モンスターが現れた！</h2>
        <p id="quiz-question">問題文がここに出ます</p>
        <div id="answers-container">
            <!-- ボタンがJSで生成されます -->
        </div>
    </div>
</div>

<div id="status-bar">
    <h2>Player Status</h2>
    <div id="level-display">Lv: 1</div>
    <div id="exp-display">EXP: 0 / 100</div>
</div>

<!-- Three.js & PointerLockControls CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>

<script>
    // === 状態管理 ===
    let isGameRunning = false;
    let isQuizActive = false;
    let level = 1;
    let exp = 0;
    let currentEnemy = null;

    // === Three.js 基本セットアップ ===
    const scene = new THREE.Scene();
    // リアルなフォグ（霧）を追加
    scene.background = new THREE.Color(0x87CEEB);
    scene.fog = new THREE.FogExp2(0x87CEEB, 0.015);

    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    // 影の描画を有効化（リアル化）
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.PointerLockControls(camera, document.body);

    // === ライティング（光と影） ===
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffee, 0.8);
    dirLight.position.set(100, 200, 50);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 0.5;
    dirLight.shadow.camera.far = 500;
    dirLight.shadow.camera.left = -100;
    dirLight.shadow.camera.right = 100;
    dirLight.shadow.camera.top = 100;
    dirLight.shadow.camera.bottom = -100;
    scene.add(dirLight);

    // === マップ生成 ===
    // 地面
    const groundGeo = new THREE.PlaneGeometry(500, 500);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x3b7a57, roughness: 0.8 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // 街並み（ビル群）の生成
    const buildings = [];
    const buildingMat = new THREE.MeshStandardMaterial({ color: 0x8899a6, roughness: 0.4 });
    for (let i = 0; i < 50; i++) {
        const width = 5 + Math.random() * 10;
        const depth = 5 + Math.random() * 10;
        const height = 10 + Math.random() * 30;
        const geo = new THREE.BoxGeometry(width, height, depth);
        const mesh = new THREE.Mesh(geo, buildingMat);
        
        mesh.position.set(
            (Math.random() - 0.5) * 200,
            height / 2,
            (Math.random() - 0.5) * 200
        );
        // 中央付近は避ける
        if (Math.abs(mesh.position.x) < 20 && Math.abs(mesh.position.z) < 20) continue;
        
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
        buildings.push(mesh);
    }

    // === モンスター（エネミー）生成 ===
    const enemies = [];
    const enemyGeo = new THREE.DodecahedronGeometry(2);
    const enemyMat = new THREE.MeshStandardMaterial({ color: 0xff4444, emissive: 0x550000 });
    
    for (let i = 0; i < 15; i++) {
        const enemy = new THREE.Mesh(enemyGeo, enemyMat);
        enemy.position.set(
            (Math.random() - 0.5) * 150,
            2,
            (Math.random() - 0.5) * 150
        );
        enemy.castShadow = true;
        // アニメーション用の初期オフセット
        enemy.userData = { startY: 2, bobSpeed: 2 + Math.random() * 2, offset: Math.random() * Math.PI * 2 };
        scene.add(enemy);
        enemies.push(enemy);
    }

    // === プレイヤー初期位置 ===
    camera.position.set(0, 3, 0);

    // === 移動ロジック ===
    const moveState = { forward: false, backward: false, left: false, right: false, sprint: false };
    document.addEventListener('keydown', (e) => {
        if (isQuizActive) return; // クイズ中は移動不可
        if (e.code === 'KeyW') moveState.forward = true;
        if (e.code === 'KeyS') moveState.backward = true;
        if (e.code === 'KeyA') moveState.left = true;
        if (e.code === 'KeyD') moveState.right = true;
        if (e.code === 'ShiftLeft') moveState.sprint = true;
    });
    document.addEventListener('keyup', (e) => {
        if (e.code === 'KeyW') moveState.forward = false;
        if (e.code === 'KeyS') moveState.backward = false;
        if (e.code === 'KeyA') moveState.left = false;
        if (e.code === 'KeyD') moveState.right = false;
        if (e.code === 'ShiftLeft') moveState.sprint = false;
    });

    // === ゲーム開始処理 ===
    document.getElementById('start-btn').addEventListener('click', () => {
        document.getElementById('start-screen').style.display = 'none';
        controls.lock();
        isGameRunning = true;
    });

    controls.addEventListener('lock', () => { isGameRunning = true; });
    controls.addEventListener('unlock', () => { 
        if(!isQuizActive) document.getElementById('start-screen').style.display = 'flex'; 
    });

    // === 魔法を撃つ（クリックで敵を判定） ===
    const raycaster = new THREE.Raycaster();
    document.addEventListener('mousedown', (e) => {
        if (!isGameRunning || isQuizActive) return;
        if (e.button !== 0) return; // 左クリックのみ

        // 画面中央からレイを飛ばす
        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        const intersects = raycaster.intersectObjects(enemies);

        if (intersects.length > 0) {
            // 敵に当たった！
            const hitEnemy = intersects[0].object;
            startQuiz(hitEnemy);
        }
    });

    // === クイズシステム（バグ修正済） ===
    const questions = [
        { q: "【算数】直方体の体積の求め方は？", options: ["たて×横×高さ", "たて＋横＋高さ", "たて×横÷高さ"], ans: 0 },
        { q: "【算数】1/2 + 1/3 は？", options: ["2/5", "5/6", "1/6"], ans: 1 },
        { q: "【理科】種子が発芽するのに絶対に必要なものは？", options: ["光・水・土", "水・空気・適当な温度", "肥料・水・光"], ans: 1 },
        { q: "【社会】日本で一番面積が広い都道府県は？", options: ["東京都", "岩手県", "北海道"], ans: 2 }
    ];

    function startQuiz(enemy) {
        isQuizActive = true;
        currentEnemy = enemy;
        
        // ★最重要バグ修正：マウスのロックを解除してUIをクリック可能にする
        controls.unlock();
        document.getElementById('quiz-modal').style.display = 'block';

        // 問題をランダムに選択
        const qData = questions[Math.floor(Math.random() * questions.length)];
        document.getElementById('quiz-question').innerText = qData.q;
        
        const container = document.getElementById('answers-container');
        container.innerHTML = "";
        
        qData.options.forEach((opt, index) => {
            const btn = document.createElement('button');
            btn.className = 'answer-btn';
            btn.innerText = opt;
            // 答えをクリックした時の処理
            btn.onclick = () => checkAnswer(index === qData.ans);
            container.appendChild(btn);
        });
    }

    function checkAnswer(isCorrect) {
        if (isCorrect) {
            alert("正解！モンスターを倒した！\n経験値 +50");
            exp += 50;
            if (exp >= 100) {
                level++;
                exp -= 100;
                alert(`レベルアップ！ レベル ${level} になりました！`);
            }
            updateStatus();
            
            // 敵を消去し、別の場所に再出現させる
            if (currentEnemy) {
                currentEnemy.position.set((Math.random() - 0.5) * 150, 2, (Math.random() - 0.5) * 150);
            }
        } else {
            alert("残念！不正解...\nもう一度挑戦しよう。");
        }

        // クイズ画面を閉じてゲームに戻る
        document.getElementById('quiz-modal').style.display = 'none';
        isQuizActive = false;
        
        // もう一度画面をクリックして視点をロックさせるための案内を出すか、自動で戻す
        // 今回は自動でロックを試みる（ブラウザの仕様で失敗した場合は再クリックが必要）
        setTimeout(() => { controls.lock(); }, 100);
    }

    function updateStatus() {
        document.getElementById('level-display').innerText = `Lv: ${level}`;
        document.getElementById('exp-display').innerText = `EXP: ${exp} / 100`;
    }

    // === メインループ ===
    const clock = new THREE.Clock();
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();
    const speed = 40.0;

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();

        if (controls.isLocked === true && !isQuizActive) {
            // 移動処理
            direction.z = Number(moveState.forward) - Number(moveState.backward);
            direction.x = Number(moveState.right) - Number(moveState.left);
            direction.normalize();

            const currentSpeed = moveState.sprint ? speed * 1.8 : speed;

            if (moveState.forward || moveState.backward) velocity.z -= direction.z * currentSpeed * delta;
            if (moveState.left || moveState.right) velocity.x -= direction.x * currentSpeed * delta;

            // 摩擦
            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;

            controls.moveRight(-velocity.x * delta);
            controls.moveForward(-velocity.z * delta);
        }

        // モンスターのアニメーション（フワフワ浮く）
        const time = Date.now() * 0.001;
        enemies.forEach(enemy => {
            const data = enemy.userData;
            enemy.position.y = data.startY + Math.sin(time * data.bobSpeed + data.offset) * 1.5;
            enemy.rotation.x += delta;
            enemy.rotation.y += delta;
        });

        renderer.render(scene, camera);
    }
    
    // ウィンドウサイズ変更対応
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
</script>
</body>
</html>
